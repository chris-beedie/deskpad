<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>deskpad</title>
<style>
  :root{color-scheme:light dark;font:14px system-ui,sans-serif}
  body{max-width:1100px;margin:1.5rem auto;padding:0 1rem}
  h1{margin:0;font-size:1.4rem}
  h2{margin:1.5rem 0 .5rem;font-size:1.1rem;border-bottom:1px solid #8884;padding-bottom:.2rem}
  h3{margin:1rem 0 .35rem;font-size:.95rem}
  .topbar{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
  #status{color:#888;font-size:.9rem;margin-left:auto}
  .pageblock{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.4rem 0 1rem}
  .slot, .encrow{background:#7771;border:1px solid #7772;border-radius:.4rem;padding:.5rem}
  .slot h4, .encrow h4{margin:0 0 .35rem;font-size:.85rem;color:#888}
  .slot .grid, .encrow .grid{display:grid;grid-template-columns:auto 1fr;gap:.25rem .5rem;align-items:center}
  label{font-size:.85rem;color:#888}
  select, input[type=text], input[type=number]{padding:.3rem .4rem;font:inherit;width:100%;box-sizing:border-box}
  .bindbox, .rendbox{margin-top:.4rem;padding:.4rem;border:1px dashed #8883;border-radius:.3rem}
  .bindbox > legend, .rendbox > legend{font-size:.8rem;padding:0 .3rem;color:#888}
  button{padding:.4rem .8rem;font:inherit;cursor:pointer}
  button.primary{background:#36c;color:#fff;border:none;border-radius:.3rem}
  .err{color:#c00}
  .ok{color:#080}
  .enc-pages{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.4rem}
  .copyrow{display:flex;gap:.5rem;align-items:center;margin-top:.25rem}
  progress{width:200px;height:.6rem}
</style>
</head>
<body>

<div class="topbar">
  <h1>deskpad</h1>
  <button id="save" class="primary">save</button>
  <span id="status">loading…</span>
</div>

<div id="cfg"></div>

<h2>firmware</h2>
<div class="copyrow">
  <input id="ota" type="file" accept=".bin">
  <button id="upload">upload &amp; reboot</button>
  <progress id="otaprog" max="100" value="0" hidden></progress>
  <span id="otamsg"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const status = $('status');

let enums = { scopes: [], hosts: [], renderers: [], binding_types: [] };
let cfg = null;

const RENDERER_FIELDS = {
  none:        [],
  static_jpeg: ['label', 'image'],
  clock:       ['label'],
  bulb:        ['label', 'state_topic', 'on_value'],
  monitor:     ['label', 'lit_when'],
  thermostat:  ['label', 'current_topic', 'target_topic', 'boost_remaining_topic'],
  text_value:  ['label', 'state_topic', 'unit'],
};

// ----- generic element helpers ----------------------------------------------
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) Object.assign(e, props);
  for (const k of kids) e.append(k);
  return e;
}
function row(labelText, control) {
  return [el('label', { textContent: labelText }), control];
}
function select(options, value, onChange) {
  const s = el('select');
  for (const o of options) s.append(el('option', { value: o, textContent: o, selected: o === value }));
  s.addEventListener('change', () => onChange(s.value));
  return s;
}
function textInput(value, onChange, placeholder) {
  const i = el('input', { type: 'text', value: value || '', placeholder: placeholder || '' });
  i.addEventListener('change', () => onChange(i.value));
  return i;
}
function numInput(value, onChange) {
  const i = el('input', { type: 'number', value: value ?? 0 });
  i.addEventListener('change', () => onChange(parseInt(i.value, 10) || 0));
  return i;
}
function checkbox(value, onChange) {
  const i = el('input', { type: 'checkbox', checked: !!value });
  i.addEventListener('change', () => onChange(i.checked));
  return i;
}

// ----- renderer config sub-form ---------------------------------------------
function renderRendererForm(rendererName, config, onChange) {
  const box = el('fieldset', { className: 'rendbox' });
  box.append(el('legend', { textContent: 'display config' }));
  const grid = el('div', { className: 'grid' });
  const fields = RENDERER_FIELDS[rendererName] || [];
  for (const f of fields) {
    if (f === 'lit_when') {
      grid.append(...row('lit_when', select(enums.hosts, config.lit_when, v => { config.lit_when = v; onChange(); })));
    } else {
      grid.append(...row(f, textInput(config[f], v => { config[f] = v; onChange(); })));
    }
  }
  if (!fields.length) box.append(el('span', { textContent: '(no fields)', style: 'color:#888;font-size:.85rem' }));
  else box.append(grid);
  return box;
}

// ----- binding sub-form -----------------------------------------------------
function renderBindingForm(binding, onChange) {
  const box = el('fieldset', { className: 'bindbox' });
  box.append(el('legend', { textContent: 'binding' }));
  const grid = el('div', { className: 'grid' });

  grid.append(...row('type', select(enums.binding_types, binding.type, v => {
    binding.type = v;
    onChange(true);   // structural change — re-render
  })));

  switch (binding.type) {
    case 'kvm_select':
      grid.append(...row('target', select(enums.hosts, binding.target || 'PC1', v => { binding.target = v; onChange(); })));
      break;
    case 'kvm_toggle':
      break;
    case 'hid_chord':
      grid.append(...row('chord', textInput(binding.chord, v => { binding.chord = v; onChange(); }, 'ctrl+shift+m')));
      grid.append(...row('hold',  checkbox(binding.hold, v => { binding.hold = v; onChange(); })));
      break;
    case 'hid_consumer':
      grid.append(...row('consumer', textInput(binding.consumer, v => { binding.consumer = v; onChange(); }, 'PLAY_PAUSE')));
      break;
    case 'ha':
      grid.append(...row('service', textInput(binding.service, v => { binding.service = v; onChange(); }, 'light.toggle')));
      grid.append(...row('entity (override)', textInput(binding.entity, v => { binding.entity = v; onChange(); }, '(inherits slot.entity)')));
      break;
    case 'ddc':
      grid.append(...row('bus', numInput(binding.bus, v => { binding.bus = v; onChange(); })));
      grid.append(...row('vcp', numInput(binding.vcp, v => { binding.vcp = v; onChange(); })));
      const variantOpts = ['', 'delta', 'value', 'command'];
      const currentVariant = (binding.delta !== undefined) ? 'delta'
                            : (binding.value !== undefined) ? 'value'
                            : (binding.command !== undefined) ? 'command' : '';
      grid.append(...row('variant', select(variantOpts, currentVariant, v => {
        delete binding.delta; delete binding.value; delete binding.command;
        if (v === 'delta') binding.delta = 0;
        else if (v === 'value') binding.value = 0;
        else if (v === 'command') binding.command = '';
        onChange(true);
      })));
      if (binding.delta !== undefined)
        grid.append(...row('delta', numInput(binding.delta, v => { binding.delta = v; onChange(); })));
      if (binding.value !== undefined)
        grid.append(...row('value', numInput(binding.value, v => { binding.value = v; onChange(); })));
      if (binding.command !== undefined)
        grid.append(...row('command', textInput(binding.command, v => { binding.command = v; onChange(); }, 'pip_off')));
      break;
  }

  box.append(grid);
  return box;
}

// ----- slot card ------------------------------------------------------------
function renderSlot(pageIdx, slotIdx, slot) {
  const card = el('div', { className: 'slot' });
  card.append(el('h4', { textContent: `p${pageIdx} · slot ${slotIdx}` }));
  const grid = el('div', { className: 'grid' });
  grid.append(...row('scope',  select(enums.scopes, slot.scope || 'global', v => { slot.scope = v; })));
  grid.append(...row('entity', textInput(slot.entity, v => { slot.entity = v; }, 'optional')));
  grid.append(...row('renderer', select(enums.renderers, slot.display?.renderer || 'none', v => {
    slot.display = slot.display || { config: {} };
    slot.display.renderer = v;
    rerender();
  })));
  card.append(grid);

  slot.display = slot.display || { renderer: 'none', config: {} };
  slot.display.config = slot.display.config || {};
  card.append(renderRendererForm(slot.display.renderer, slot.display.config, () => {}));

  slot.binding = slot.binding || { type: 'none' };
  card.append(renderBindingForm(slot.binding, (struct) => { if (struct) rerender(); }));
  return card;
}

// ----- encoder card ---------------------------------------------------------
function renderEncoder(encIdx, enc) {
  const wrap = el('div');
  wrap.append(el('h3', { textContent: `encoder ${encIdx}` }));

  const copyBtn = el('button', { textContent: 'copy page 0 → all' });
  copyBtn.addEventListener('click', () => {
    const src = enc.pages[0];
    enc.pages = enc.pages.map(() => JSON.parse(JSON.stringify(src)));
    rerender();
  });
  wrap.append(el('div', { className: 'copyrow' }, copyBtn));

  const pages = el('div', { className: 'enc-pages' });
  enc.pages.forEach((pg, pi) => {
    const row = el('div', { className: 'encrow' });
    row.append(el('h4', { textContent: `page ${pi}` }));
    row.append(el('div', { textContent: 'press:', style: 'font-size:.8rem;color:#888' }));
    row.append(renderBindingForm(pg.press, (struct) => { if (struct) rerender(); }));
    row.append(el('div', { textContent: 'twist +:', style: 'font-size:.8rem;color:#888;margin-top:.3rem' }));
    row.append(renderBindingForm(pg.twist_pos, (struct) => { if (struct) rerender(); }));
    row.append(el('div', { textContent: 'twist –:', style: 'font-size:.8rem;color:#888;margin-top:.3rem' }));
    row.append(renderBindingForm(pg.twist_neg, (struct) => { if (struct) rerender(); }));
    pages.append(row);
  });
  wrap.append(pages);
  return wrap;
}

// ----- full render ----------------------------------------------------------
function rerender() {
  const root = $('cfg');
  root.innerHTML = '';

  // KVM topology
  root.append(el('h2', { textContent: 'KVM topology' }));
  const kvmGrid = el('div', { style: 'display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.25rem .5rem;align-items:center' });
  for (const which of ['monitor_a', 'monitor_b']) {
    const m = cfg.kvm[which];
    kvmGrid.append(el('label', { textContent: `${which} bus` }), numInput(m.ddc_bus, v => m.ddc_bus = v));
    kvmGrid.append(el('span'), el('span'));   // filler
    kvmGrid.append(el('label', { textContent: '  pc1' }), numInput(m.input_pc1, v => m.input_pc1 = v));
    kvmGrid.append(el('label', { textContent: '  pc2' }), numInput(m.input_pc2, v => m.input_pc2 = v));
  }
  root.append(kvmGrid);

  // Pages
  cfg.pages.forEach((page, pi) => {
    root.append(el('h2', { textContent: `page ${pi}` }));
    const grid = el('div', { className: 'pageblock' });
    page.slots.forEach((slot, si) => grid.append(renderSlot(pi, si, slot)));
    root.append(grid);
  });

  // Encoders
  root.append(el('h2', { textContent: 'encoders' }));
  cfg.encoders.forEach((enc, ei) => root.append(renderEncoder(ei, enc)));
}

// ----- load + save ----------------------------------------------------------
async function load() {
  try {
    const [e, c] = await Promise.all([
      fetch('/api/enums').then(r => r.json()),
      fetch('/api/config').then(r => r.json()),
    ]);
    enums = e; cfg = c;
    rerender();
    status.textContent = `loaded (v${cfg.version})`;
  } catch (e) {
    status.textContent = 'load failed: ' + e;
    status.className = 'err';
  }
}

$('save').addEventListener('click', async () => {
  status.textContent = 'saving…'; status.className = '';
  try {
    const r = await fetch('/api/config', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(cfg),
    });
    if (!r.ok) throw new Error(await r.text());
    status.textContent = 'saved'; status.className = 'ok';
  } catch (e) {
    status.textContent = 'save failed: ' + e; status.className = 'err';
  }
});

// ----- OTA ------------------------------------------------------------------
const otaMsg = $('otamsg');
$('upload').addEventListener('click', () => {
  const file = $('ota').files[0];
  if (!file) { otaMsg.textContent = 'pick a .bin first'; otaMsg.className = 'err'; return; }
  otaMsg.textContent = ''; otaMsg.className = '';
  const prog = $('otaprog');
  prog.hidden = false; prog.value = 0;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/ota');
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) prog.value = Math.round(100*e.loaded/e.total); };
  xhr.onload = async () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      otaMsg.textContent = 'upload ok — rebooting…'; otaMsg.className = 'ok';
      try { await fetch('/api/reboot', { method: 'POST' }); } catch {}
    } else {
      otaMsg.textContent = 'upload failed: ' + xhr.responseText;
      otaMsg.className = 'err';
    }
  };
  xhr.onerror = () => { otaMsg.textContent = 'upload network error'; otaMsg.className = 'err'; };
  xhr.send(file);
});

load();
</script>
</body>
</html>
